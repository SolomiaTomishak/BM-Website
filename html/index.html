<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Березівська молодь</title>
    <link rel="icon" href="../assets/logo.png" type="image/png" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header id="main-header"></header>

    <div class="main">
      <h1>Про нас</h1>
      <p>
        Наша організація створена для того щоб сприяти розвитку молодіжних
        ініціатив та підтримувати активну участь молоді в житті нашого села. Ми
        захищаємо права та інтереси молоді в суспільстві, пропагуємо освіту та
        спорт.
      </p>

      <div class="about-gallery" aria-label="Фото Березівської молоді">
        <img
          class="about-photo about-photo-top-crop"
          src="../assets/about-1.jpg"
          alt="Березівська молодь під час благодійної ініціативи"
        />
        <img
          class="about-photo about-photo-church-crop"
          src="../assets/about-2.jpg"
          alt="Березівська молодь біля церкви"
        />
      </div>
    </div>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/common.js"></script>
  </body>
</html>
