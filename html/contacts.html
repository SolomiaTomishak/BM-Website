<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Контакти - Березівська молодь</title>
    <link rel="icon" href="../assets/logo.png" type="image/png" />
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      .contact-container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #f9f9f9;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .contact-container h2 {
        color: #3636a0;
        text-align: center;
      }
      .contact-form {
        display: flex;
        flex-direction: column;
      }
      .contact-form input,
      .contact-form textarea {
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-family: inherit;
      }
      .contact-form button {
        padding: 12px;
        background-color: #3636a0;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.3s;
      }
      .contact-form button:hover {
        background-color: #2a2a80;
      }
      #form-status {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header id="main-header"></header>

    <div class="contact-container">
      <h2>Зв'яжіться з нами</h2>
      <form id="contactForm" class="contact-form">
        <input type="text" id="name" placeholder="Ваше ім'я" required />
        <input type="email" id="email" placeholder="Ваш Email" required />
        <textarea
          id="message"
          rows="5"
          placeholder="Ваше повідомлення..."
          required
        ></textarea>
        <button type="submit">Надіслати повідомлення</button>
      </form>
      <div id="form-status"></div>
    </div>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/common.js"></script>

    <script>
      document
        .getElementById("contactForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const status = document.getElementById("form-status");
          const submitButton = this.querySelector("button");
          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const message = document.getElementById("message").value.trim();

          if (!name || !email || !message) {
            status.style.color = "red";
            status.innerText = "Будь ласка, заповніть усі поля.";
            return;
          }

          const newMessage = {
            name,
            email,
            message,
          };

          submitButton.disabled = true;
          submitButton.innerText = "Надсилаємо...";
          status.style.color = "#62677b";
          status.innerText = "Надсилаємо повідомлення...";

          try {
            const { error } = await window._supabase
              .from("contact_messages")
              .insert([newMessage]);

            if (error) throw error;

            status.style.color = "green";
            status.innerText = "Дякуємо! Ваше повідомлення надіслано.";
            this.reset();
          } catch (err) {
            console.error(err);
            status.style.color = "red";
            status.innerText =
              "Не вдалося надіслати повідомлення. Спробуйте пізніше.";
          } finally {
            submitButton.disabled = false;
            submitButton.innerText = "Надіслати повідомлення";
          }
        });
    </script>
  </body>
</html>
