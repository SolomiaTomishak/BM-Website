<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Звіти та публікації - Березівська молодь</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      .search-container {
        padding: 20px;
        text-align: center;
      }
      #searchBar {
        padding: 10px;
        width: 60%;
        border-radius: 5px;
        border: 1px solid #ccc;
      }
      .posts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        padding: 20px;
      }
      .post-card {
        border: 1px solid #ddd;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
      }
      .post-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }
      .post-info {
        padding: 15px;
      }
      .post-info h3 {
        margin-top: 0;
        color: #3636a0;
      }
    </style>
  </head>
  <body>
    <header id="main-header"></header>

    <div class="search-container">
      <input
        type="text"
        id="searchBar"
        placeholder="Пошук публікацій за назвою чи описом..."
      />
    </div>
    <div class="posts-grid" id="postsContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/common.js"></script>
    <script src="../js/posts.js"></script>
  </body>
</html>
