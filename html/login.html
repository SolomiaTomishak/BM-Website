<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Вхід - Березівська молодь</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      .login-card {
        max-width: 300px;
        margin: 100px auto;
        padding: 20px;
        border: 1px solid #3636a0;
        border-radius: 8px;
        text-align: center;
        background-color: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .login-card input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .login-card button {
        width: 100%;
        padding: 10px;
        background: #3636a0;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
      }
      .login-card button:hover {
        background: #2a2a80;
      }
    </style>
  </head>
  <body>
    <header id="main-header"></header>

    <div class="login-card">
      <h2>Вхід</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Пароль" required />
        <p
          id="errorMsg"
          style="color: red; display: none; margin: 10px 0; font-size: 14px"
        ></p>
        <button type="submit">Увійти</button>
      </form>
    </div>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/common.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
