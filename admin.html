<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель адміністратора - Березівська молодь</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-main { padding: 20px; max-width: 800px; margin: 0 auto; }
        .message-card {
            background: #fff;
            border-left: 5px solid #3636a0;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }
        .message-card h3 { margin: 0 0 10px 0; color: #3636a0; }
        .message-card p { margin: 5px 0; }
        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            float: right;
        }
        .post-form-section {
            margin-bottom: 40px;
            border-bottom: 2px solid #ccc;
            padding-bottom: 20px;
        }
        .post-form-section form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }
        .post-form-section input, .post-form-section textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .submit-btn {
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<header id="main-header"></header>

<div class="admin-main">
    <h1>Панель адміністратора</h1>

    <section class="post-form-section">
        <h2>Додати новий звіт</h2>
        <form id="addPostForm">
            <input type="text" id="postTitle" placeholder="Назва звіту" required>
            <input type="text" id="postCategory" placeholder="Категорія" required>
            <textarea id="postDesc" placeholder="Опис" rows="3" required></textarea>
            <input type="text" id="postImage" placeholder="Шлях до фото (напр. ./assets/post1.jpg)" required>
            <button type="submit" class="submit-btn">Опублікувати</button>
        </form>
    </section>

    <div id="messagesList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="common.js"></script>
    <script src="admin.js"></script>
</body>
</html>
